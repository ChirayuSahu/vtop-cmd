# Lints and builds the homepage, only when something under website/ (or this file) changes.
# It isn't a required check, so pull requests that skip it can still merge.
name: Website

on:
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
