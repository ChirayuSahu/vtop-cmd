# Push a version tag on main to publish a GitHub release with the Chrome and Firefox packages.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag matches the extension version and is on main
        run: |
          version=$(node -p "require('./manifest.json').version")
          package=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ] || [ "$package" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must match manifest.json ($version) and package.json ($package)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main; release only merged code"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Lint the Firefox package
        run: npx --yes web-ext@8.10.0 lint --source-dir dist/vtop-command-firefox --no-input

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/vtop-command-$VERSION.zip" \
            "dist/vtop-command-firefox-$VERSION.zip" \
            --title "VTOP Command $VERSION" \
            --generate-notes \
            --verify-tag
