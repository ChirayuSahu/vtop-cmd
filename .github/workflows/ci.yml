# Runs on every pull request and on pushes to main. Make "Test and build" a required
# status check on main so a pull request can't merge while it fails.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The build script and a test read the browser manifests through Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      # Mozilla's add-on validator: fails on errors that Firefox's review would reject.
      - name: Lint the Firefox package
        run: npx --yes web-ext@8.10.0 lint --source-dir dist/vtop-command-firefox --no-input

      - uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: dist/*.zip
          retention-days: 14
