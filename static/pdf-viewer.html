<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document viewer</title><link rel="stylesheet" href="pdf-viewer.css"><script src="brand.js"></script></head>
<body>
<nav aria-label="Document controls"><label>Page <input id="page" type="number" min="1" value="1" disabled></label><span id="total">/ —</span><span class="spacer"></span><button id="zoom-out" type="button" aria-label="Zoom out" disabled>−</button><output id="zoom">100%</output><button id="zoom-in" type="button" aria-label="Zoom in" disabled>+</button><button id="fit" type="button" disabled>Fit width</button></nav>
<p id="status" role="status" aria-live="polite">Preparing document viewer…</p>
<form id="password-form" hidden><label>Password for this PDF <input id="password" type="password" autocomplete="off"></label><button type="submit">Unlock</button></form>
<main id="pages" tabindex="0" aria-label="Scrollable document"></main>
<script type="module" src="pdf-viewer.mjs"></script></body></html>
